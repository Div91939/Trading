name: US Stock Signals

on:
  workflow_dispatch:
  # Manual trigger only — you dispatch this yourself.
  # If you ever want it automatic: GitHub cron is always UTC with no DST, so
  # use ONE line. 22:30 UTC is after the US close in both halves of the year.
  # Never add a second "EST line" — both would fire every weekday.
  # schedule:
  #   - cron: '30 22 * * 1-5'

permissions:
  contents: write

jobs:
  run-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # continue-on-error so a crash part way through can never block the
      # commit step below. Without it, a mid-run failure leaves the CSVs
      # updated on disk but never pushed, and the next run re-does the work.
      - name: Run US Smallcap
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        continue-on-error: true
        run: python US_Smallcap.py

      - name: Commit updated CSVs
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # us_smallcap_data/ holds the price CSVs. The JSON state is committed
          # too, or the day-1 follow-up queue and the fire log reset every run.
          git add us_smallcap_data/
          git add -A -- '*.json'

          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Auto: update us_smallcap_data $(date +'%d-%m-%Y %H:%M UTC')"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME}
            git push
          fi

      - name: Report freshness
        if: always()
        run: |
          python - <<'EOF'
          import glob, os, pandas as pd
          for root in ("us_smallcap_data",):
              files = glob.glob(os.path.join(root, "*.csv"))
              latest = {}
              for f in files:
                  try:
                      d = pd.read_csv(f, usecols=["Date"])
                      m = pd.to_datetime(d["Date"], format="%d-%m-%Y", errors="coerce").max()
                      if pd.notna(m):
                          latest[m] = latest.get(m, 0) + 1
                  except Exception:
                      pass
              print(f"{root}: {len(files)} files")
              for k in sorted(latest, reverse=True)[:3]:
                  print(f"   {k.date()} : {latest[k]} files")
          EOF
